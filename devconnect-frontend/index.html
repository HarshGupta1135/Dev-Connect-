<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevConnect — where developers and recruiters meet on skills, not keywords. Every role scored against what you actually build." />
    <title>DevConnect — matched on skills, not keywords</title>

    <!-- Brand mark as an inline SVG favicon: no extra request, and without one the
         browser's /favicon.ico probe falls into the SPA rewrite and gets HTML. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230891b2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The browser chrome tints to match the theme. -->
    <meta name="theme-color" content="#f5f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />

    <!-- What a shared link looks like in a chat or feed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevConnect" />
    <meta property="og:title" content="DevConnect — matched on skills, not keywords" />
    <meta property="og:description" content="A job board that scores every role against the skills you actually have." />
    <meta name="twitter:card" content="summary" />

    <!-- The first API call pays DNS + TLS to the backend; warming it here removes
         that from the critical path of the first meaningful fetch. -->
    <link rel="preconnect" href="https://devconnect-backend-u07y.onrender.com" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
