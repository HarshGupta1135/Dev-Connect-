server:
  # Railway (and most PaaS) assign a port at runtime and route to it, so a hardcoded
  # 8080 means the health check never connects and the deploy is marked failed.
  # Locally nothing sets PORT, so this stays 8080.
  port: ${PORT:8080}

spring:
  application:
    name: DevConnect

  # Secrets are read from the git-ignored .env file in the project root.
  # "optional:" keeps startup working where real environment variables are used instead,
  # and OS environment variables take precedence over the file.
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/devconnect}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway owns the schema now. Migrations live in db/migration and run in version
  # order before Hibernate is handed the datasource.
  flyway:
    enabled: true
    # This database already has the V1 tables, created by ddl-auto before Flyway
    # existed. Without this Flyway would refuse to start against a non-empty schema it
    # has no history table for; with it, the existing state is recorded as V1 and V1's
    # script is skipped. A fresh database gets the script instead.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema as generated by Hibernate ddl-auto"

  jpa:
    hibernate:
      # Was `update`, which is what let the schema drift: it silently declined to add
      # the unique constraints on users.user_name and users.email to a table that
      # already existed, so those had to be applied by hand and existed in no file.
      # `validate` only checks the mapping against what Flyway built, and changes
      # nothing — so a mismatch is a startup failure instead of a surprise later.
      ddl-auto: validate
    # Off unless asked for: every statement carries its parameters, so leaving this on
    # in a deployed environment writes user data into the log stream.
    show-sql: ${SHOW_SQL:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  secret: ${JWT_SECRET}

# Transactional mail. With an API key set, mail goes over Brevo's HTTPS API instead
# of SMTP — Render's free tier blocks outbound ports 25, 465 and 587, so Gmail SMTP
# times out there and every send fails silently. Blank locally, where SMTP works.
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-name: ${MAIL_FROM_NAME:DevConnect}
  # Must be an address verified in Brevo, or the API rejects the send with a 400.
  sender-email: ${MAIL_FROM:${MAIL_USERNAME}}

app:
  cors:
    # Empty in development: the Vite dev server proxies /api, so the browser only ever
    # talks to its own origin and there is nothing to allow. Once the client is hosted
    # somewhere else it becomes cross-origin — set this to that origin, comma-separated
    # for more than one. Nothing is sent while it is empty.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  admin:
    # The seeded admin account is created only when a password is supplied. It used to
    # be created unconditionally with a hardcoded one, which on a public URL is an
    # administrator account with a known password.
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
