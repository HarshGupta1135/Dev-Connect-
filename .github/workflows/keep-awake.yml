# Keeps the deployed backend from going to sleep.
#
# Render spins a free web service down after 15 minutes without traffic, and
# waking it means starting a JVM on half a CPU — the first visitor after a quiet
# spell waits one to two minutes and reasonably concludes the site is broken.
#
# Render allows 750 instance-hours a month against a ~730-hour month, so keeping a
# single service running continuously fits inside the free allowance. Adding a
# second free service would not.
#
# Public repository, so these runs cost nothing.

name: Keep backend awake

on:
  schedule:
    # Every 10 minutes. GitHub does not promise punctuality — a scheduled run can
    # be minutes late under load — so this is deliberately tighter than the
    # 15-minute idle timeout it is defending against.
    - cron: '*/10 * * * *'
  # So it can be triggered by hand from the Actions tab, which is also the way to
  # confirm it works without waiting for a slot.
  workflow_dispatch:

concurrency:
  # A late run must never queue up behind an earlier one.
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Comfortably above the worst case below (120s + 60s). It was 5 minutes against
    # a 360-second curl budget, so every run that met a sleeping backend was killed
    # by its own timeout and reported "cancelled" — which reads as a scheduling
    # quirk rather than the outage it actually was.
    timeout-minutes: 8
    steps:
      - name: Wake the API
        run: |
          BASE="https://devconnect-backend-u07y.onrender.com"

          # Patient enough for a cold start, bounded well inside the job timeout.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$BASE/health" || echo "000")
          echo "health: $code"

          # Hits the database too. /health touches nothing, so pinging only that
          # would keep Render awake while letting Aiven idle down separately — and
          # an idle Aiven is what takes the whole backend down with it.
          jobs_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$BASE/api/jobs?page=0&size=1" || echo "000")
          echo "jobs: $jobs_code"

          if [ "$code" != "200" ]; then
            echo "::error::Backend did not return 200 from /health (got $code). If this persists, check whether the Aiven database has powered off — the app cannot start without it."
            exit 1
          fi

          if [ "$jobs_code" != "200" ]; then
            echo "::error::/api/jobs returned $jobs_code — the API is up but the database is not answering."
            exit 1
          fi
