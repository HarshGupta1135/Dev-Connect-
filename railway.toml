# Railway picks the Dockerfile up on its own; this states it explicitly so a stray
# package.json in the repo can never cause a different builder to be chosen.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway waits for this to answer before routing traffic to a new deployment, so a
# failed migration or a bad database variable fails the deploy instead of going live
# broken. /health is permitAll, so no token is needed.
healthcheckPath = "/health"
healthcheckTimeout = 120

# Flyway runs at startup and takes a lock, so two instances racing to migrate is not a
# concern — but nothing here is designed for horizontal scale either: the expired-job
# sweep and the status-mail sweep are plain @Scheduled methods, and a second instance
# would run them a second time.
numReplicas = 1

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
