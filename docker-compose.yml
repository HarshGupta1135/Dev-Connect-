# Brings up the backend with its own MySQL and Redis: docker compose up --build
#
# Three kinds of value are in play, and keeping them apart is the whole trick:
#
#   real secrets    — mail password, Cloudinary keys, JWT signing key. Read from
#                     .env, which stays git-ignored and never enters an image.
#   addresses       — where MySQL and Redis live. Overridden below: the values in
#                     .env point at localhost and at Upstash, and neither is right
#                     once the app is a container on this network.
#   local-only      — the passwords for the throwaway MySQL and Redis in this
#     credentials     stack. Defaulted here rather than taken from .env, so this
#                     stack never borrows the host database's password or the
#                     Upstash token. Override them by setting LOCAL_DB_PASSWORD or
#                     LOCAL_REDIS_PASSWORD if you want something else.
#
# `environment:` wins over `env_file:`, which is what lets those overrides work
# without editing .env at all.

services:
  mysql:
    image: mysql:8
    container_name: devconnect-mysql
    restart: unless-stopped
    environment:
      # The app connects as root because that is the simplest thing that matches
      # the app's config. A least-privilege user is the better habit for anything
      # long-lived; this database exists only on your machine.
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:-devconnect-local}
      MYSQL_DATABASE: devconnect
    ports:
      # 3307, not 3306: you already run MySQL on the host, and publishing over it
      # would fail to bind. The app does not use this mapping — it reaches MySQL
      # over the compose network — it is here so you can point a client at it.
      - "3307:3306"
    volumes:
      # Named volume, so the database survives `docker compose down`. Without it
      # every restart would start from an empty schema.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Plain depends_on only waits for the container to start, and MySQL takes a
      # good while after that before it accepts connections. Without this gate the
      # app boots first and dies on a refused connection.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: devconnect-redis
    restart: unless-stopped
    # redis:alpine has no password at all by default, but the app always sends AUTH
    # because spring.data.redis.password is set. An unauthenticated server rejects
    # that outright, so the server is given the same password the client will use.
    command: ["redis-server", "--requirepass", "${LOCAL_REDIS_PASSWORD:-devconnect-local}"]
    ports:
      # 6380 for the same reason as MySQL's 3307.
      - "6380:6379"
    volumes:
      - redis-data:/data
    environment:
      # Read by the healthcheck below; the server itself takes it from command.
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:-devconnect-local}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devconnect-app
    # Mail, Cloudinary and JWT_SECRET come from here untouched.
    env_file:
      - .env
    environment:
      # Service names, not localhost: inside a container localhost is the container.
      DB_URL: jdbc:mysql://mysql:3306/devconnect
      DB_USERNAME: root
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-devconnect-local}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:-devconnect-local}
      # Upstash requires TLS and .env says so; a local Redis does not speak it.
      REDIS_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
